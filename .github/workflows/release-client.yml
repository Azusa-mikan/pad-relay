name: Build and release client

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Test Go client
        run: go version && go test -race ./...
      - name: Test browser shim
        run: node --test tests/ws-shim.test.js

  linux:
    name: Linux amd64
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install linker dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Build
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -tags static -ldflags "-s -w" -o build/pad-relay-client ./cmd/gamepad-client
      - name: Package
        run: |
          mkdir -p dist
          cp LICENSE build/LICENSE
          tar -C build -czf dist/pad-relay-client_linux_amd64.tar.gz pad-relay-client LICENSE
      - uses: actions/upload-artifact@v7
        with:
          name: pad-relay-client_linux_amd64
          path: dist/pad-relay-client_linux_amd64.tar.gz
          if-no-files-found: error
          compression-level: 0

  macos:
    name: macOS universal
    needs: check
    runs-on: macos-latest
    env:
      CGO_ENABLED: "1"
      GOOS: darwin
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v5
      - name: Build Intel
        env:
          GOARCH: amd64
          CC: clang -arch x86_64
        run: go build -trimpath -tags static -ldflags "-s -w" -o build/amd64/pad-relay-client ./cmd/gamepad-client
      - name: Build Apple Silicon
        env:
          GOARCH: arm64
          CC: clang -arch arm64
        run: go build -trimpath -tags static -ldflags "-s -w" -o build/arm64/pad-relay-client ./cmd/gamepad-client
      - name: Package universal binary
        run: |
          mkdir -p build/universal dist
          lipo -create \
            build/amd64/pad-relay-client \
            build/arm64/pad-relay-client \
            -output build/universal/pad-relay-client
          lipo build/universal/pad-relay-client -verify_arch x86_64 arm64
          cp LICENSE build/universal/LICENSE
          tar -C build/universal -czf dist/pad-relay-client_macos_universal.tar.gz pad-relay-client LICENSE
      - uses: actions/upload-artifact@v7
        with:
          name: pad-relay-client_macos_universal
          path: dist/pad-relay-client_macos_universal.tar.gz
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Windows amd64
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
      - name: Add MinGW to PATH
        shell: pwsh
        run: |
          "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify toolchain
        shell: pwsh
        run: |
          go version
          gcc --version
          ld --version
      - name: Build
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: amd64
          CC: gcc
        run: go build -trimpath -ldflags "-s -w" -o build/pad-relay-client.exe ./cmd/gamepad-client
      - name: Verify executable
        shell: pwsh
        run: |
          $mingwBin = "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin"
          $queue = [System.Collections.Generic.Queue[string]]::new()
          $seen = @{}
          $queue.Enqueue((Resolve-Path "build/pad-relay-client.exe").Path)

          while ($queue.Count -gt 0) {
              $binary = $queue.Dequeue()
              foreach ($line in (& objdump -p $binary)) {
                  if ($line -notmatch "DLL Name:\s+(\S+)$") {
                      continue
                  }
                  $dll = $Matches[1]
                  $key = $dll.ToLowerInvariant()
                  if ($seen.ContainsKey($key)) {
                      continue
                  }
                  $seen[$key] = $true
                  if ($key -eq "msys-2.0.dll") {
                      throw "The executable unexpectedly depends on the MSYS2 runtime"
                  }

                  $source = Join-Path $mingwBin $dll
                  if (Test-Path $source) {
                      $destination = Join-Path "build" $dll
                      Copy-Item $source $destination
                      $queue.Enqueue((Resolve-Path $destination).Path)
                  }
              }
          }

          if (-not (Test-Path "build/SDL2.dll")) {
              throw "SDL2.dll was not discovered in the executable dependencies"
          }
          Copy-Item "${{ steps.msys2.outputs.msys2-location }}\mingw64\share\licenses\SDL2\LICENSE.txt" build/SDL2-LICENSE.txt

          Get-ChildItem build/*.dll | ForEach-Object { Write-Host "Bundled $($_.Name)" }
          $originalPath = $env:PATH
          try {
              $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
              .\build\pad-relay-client.exe -h
              if ($LASTEXITCODE -ne 0) {
                  throw "Windows executable smoke test failed with exit code $LASTEXITCODE"
              }
          } finally {
              $env:PATH = $originalPath
          }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item LICENSE build/LICENSE
          Compress-Archive -Path build/pad-relay-client.exe,build/*.dll,build/LICENSE,build/SDL2-LICENSE.txt -DestinationPath dist/pad-relay-client_windows_amd64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: pad-relay-client_windows_amd64
          path: dist/pad-relay-client_windows_amd64.zip
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs:
      - linux
      - macos
      - windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd release
          sha256sum pad-relay-client_*.tar.gz pad-relay-client_*.zip > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$(date -u +'%Y%m%d-%H%M%S')"
          gh release create "$tag" \
            release/pad-relay-client_linux_amd64.tar.gz \
            release/pad-relay-client_macos_universal.tar.gz \
            release/pad-relay-client_windows_amd64.zip \
            release/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "PadRelay client $tag" \
            --generate-notes \
            --latest
