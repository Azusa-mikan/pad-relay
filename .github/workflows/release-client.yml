name: Build and release client

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux amd64
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y golang-go gcc pkg-config libsdl2-dev nodejs
      - name: Test
        run: |
          go version
          go test -race ./...
          node --test tests/ws-shim.test.js
      - name: Build
        run: |
          cat > /tmp/pkg-config-static-sdl <<"EOF"
          #!/bin/sh
          if [ "$1" = "--libs" ]; then
            shift
            flags=$(/usr/bin/pkg-config --static --libs "$@") || exit $?
            printf "%s\n" "$flags" | sed "s/-lSDL2/-Wl,-Bstatic -lSDL2 -Wl,-Bdynamic/"
            exit 0
          fi
          exec /usr/bin/pkg-config "$@"
          EOF
          chmod +x /tmp/pkg-config-static-sdl
          mkdir -p build
          PKG_CONFIG=/tmp/pkg-config-static-sdl CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" -o build/pad-relay-client ./cmd/gamepad-client
          if ldd build/pad-relay-client | grep -q "libSDL2"; then
            echo "SDL2 was dynamically linked"
            exit 1
          fi
      - name: Package
        run: |
          mkdir -p dist
          cp LICENSE build/LICENSE
          cp /usr/share/doc/libsdl2-dev/copyright build/SDL2-LICENSE.txt
          tar -C build -czf dist/pad-relay-client_linux_amd64.tar.gz pad-relay-client LICENSE SDL2-LICENSE.txt
      - uses: actions/upload-artifact@v7
        with:
          name: pad-relay-client_linux_amd64
          path: dist/pad-relay-client_linux_amd64.tar.gz
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Windows amd64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./...
      - name: Build
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -ldflags "-s -w" -o build/pad-relay-client.exe ./cmd/gamepad-client
      - name: Verify executable
        shell: pwsh
        run: |
          .\build\pad-relay-client.exe -version
          if ($LASTEXITCODE -ne 0) {
              throw "Windows executable smoke test failed with exit code $LASTEXITCODE"
          }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item LICENSE build/LICENSE
          Compress-Archive -Path build/pad-relay-client.exe,build/LICENSE -DestinationPath dist/pad-relay-client_windows_amd64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: pad-relay-client_windows_amd64
          path: dist/pad-relay-client_windows_amd64.zip
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs:
      - linux
      - windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd release
          sha256sum pad-relay-client_*.tar.gz pad-relay-client_*.zip > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$(date -u +'%Y%m%d-%H%M%S')"
          gh release create "$tag" \
            release/pad-relay-client_linux_amd64.tar.gz \
            release/pad-relay-client_windows_amd64.zip \
            release/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "PadRelay client $tag" \
            --generate-notes \
            --latest
